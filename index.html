<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Antes de invitar</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0A1A33" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0A1A33;
    color: #E8F0FE;
    min-height: 100vh;
  }
  header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid #1E3A5F;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 12px; color: #8FAAD1; }

  .search-wrap { padding: 20px 20px 0; position: relative; }
  .search-wrap input {
    width: 100%;
    background: #12274A;
    border: 1px solid #1E3A5F;
    border-radius: 12px;
    padding: 12px 36px 12px 36px;
    font-size: 14px;
    color: #E8F0FE;
  }
  .search-wrap input::placeholder { color: #6E88B5; }
  .search-icon { position: absolute; left: 32px; top: 32px; color: #6E88B5; font-size: 14px; }
  .clear-btn {
    position: absolute; right: 32px; top: 30px; background: none; border: none;
    color: #6E88B5; font-size: 16px; cursor: pointer;
  }

  .result-banner {
    margin: 12px 20px 0;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
  }
  .result-banner.ok { background: #0F2A1C; color: #5FD98A; border: 1px solid #1E4A32; }
  .result-banner.warn { background: #2A140F; color: #F5A28A; border: 1px solid #4A241E; }

  .actions { display: flex; gap: 8px; padding: 16px 20px 0; }
  .actions button {
    flex: 1;
    background: #12274A;
    border: 1px solid #1E3A5F;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-weight: 500;
    color: #E8F0FE;
    cursor: pointer;
  }
  .actions button:active { background: #16305A; }

  ul#list { list-style: none; margin: 0; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  #list li {
    display: flex; justify-content: space-between; align-items: center;
    background: #12274A; border: 1px solid #1E3A5F; border-radius: 8px;
    padding: 12px 16px;
  }
  #list li .name { font-size: 14px; font-weight: 600; }
  #list li .meta { font-size: 12px; color: #6E88B5; margin-top: 2px; }
  #list li button {
    background: none; border: none; color: #6E88B5; font-size: 16px; cursor: pointer;
  }

  .empty { text-align: center; padding-top: 56px; color: #8FAAD1; font-size: 14px; padding-left: 16px; padding-right: 16px; }

  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: flex-end; justify-content: center; z-index: 20;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #0F2245; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0;
    padding: 20px; border-top: 1px solid #1E3A5F;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .modal-header button { background: none; border: none; color: #6E88B5; font-size: 16px; cursor: pointer; }
  .modal input, .modal textarea {
    width: 100%; background: #12274A; border: 1px solid #1E3A5F; border-radius: 8px;
    padding: 10px 12px; font-size: 14px; color: #E8F0FE; margin-bottom: 8px; resize: none;
    font-family: inherit;
  }
  .modal input::placeholder, .modal textarea::placeholder { color: #6E88B5; }
  .modal p.hint { font-size: 12px; color: #6E88B5; margin: 0 0 12px; }
  .modal .save-btn {
    width: 100%; background: #2E7DF6; border: none; border-radius: 8px; padding: 12px;
    font-size: 14px; font-weight: 500; color: white; cursor: pointer;
  }
  .modal .save-btn:disabled { opacity: 0.4; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1E3A5F; color: #E8F0FE; font-size: 12px; padding: 8px 16px;
    border-radius: 999px; border: 1px solid #234270; z-index: 30; display: none;
  }
  .toast.show { display: block; }
</style>
</head>
<body>

<header>
  <h1>Antes de invitar</h1>
  <p id="count">0 contactos guardados</p>
</header>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input id="searchInput" placeholder="Busca un nombre antes de invitar..." />
  <button class="clear-btn" id="clearBtn" style="display:none;">✕</button>
</div>
<div id="banner"></div>

<div class="actions">
  <button id="openAdd">＋ Añadir</button>
  <button id="openImport">⇧ Importar Excel</button>
</div>

<ul id="list"></ul>

<!-- Add modal -->
<div class="modal-bg" id="addModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Añadir contacto</h2>
      <button id="closeAdd">✕</button>
    </div>
    <input id="newName" placeholder="Nombre" />
    <input id="newEmpresa" placeholder="Empresa (opcional)" />
    <button class="save-btn" id="saveAdd">Guardar</button>
  </div>
</div>

<!-- Import modal -->
<div class="modal-bg" id="importModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Importar desde Excel</h2>
      <button id="closeImport">✕</button>
    </div>
    <p class="hint">Selecciona en tu Excel las columnas de Nombre y Empresa juntas y pégalas aquí (una persona por línea).</p>
    <textarea id="importText" rows="6" placeholder="Juan Pérez García&#9;Acme Corp
María López Ruiz&#9;Banco Santander"></textarea>
    <button class="save-btn" id="saveImport" disabled>Importar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'linkedin_check_contacts';

function loadContacts() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveContacts(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function normalize(s) { return s.trim().toLowerCase(); }

let contacts = loadContacts();

const listEl = document.getElementById('list');
const countEl = document.getElementById('count');
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const bannerEl = document.getElementById('banner');
const toastEl = document.getElementById('toast');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function render() {
  countEl.textContent = contacts.length + (contacts.length === 1 ? ' contacto guardado' : ' contactos guardados');
  const q = searchInput.value.trim();
  clearBtn.style.display = q ? 'block' : 'none';

  let shown = contacts;
  if (q) {
    const nq = normalize(q);
    shown = contacts.filter(c => normalize(c.name).includes(nq));
    if (shown.length === 0) {
      bannerEl.innerHTML = '<div class="result-banner ok">✓ Vía libre — no está en tu lista, puedes invitarlo.</div>';
    } else {
      bannerEl.innerHTML = `<div class="result-banner warn">⚠ Cuidado — ${shown.length} coincidencia${shown.length>1?'s':''} encontrada${shown.length>1?'s':''}, ya lo intentaste antes.</div>`;
    }
  } else {
    bannerEl.innerHTML = '';
  }

  if (contacts.length === 0) {
    listEl.innerHTML = '<div class="empty">Aún no tienes contactos guardados. Importa tu Excel o añade uno a mano.</div>';
    return;
  }

  listEl.innerHTML = shown.map(c => `
    <li data-id="${c.id}">
      <div>
        <div class="name">${escapeHtml(c.name)}</div>
        <div class="meta">${c.note ? escapeHtml(c.note) + ' · ' : 'Sin empresa · '}${c.date}</div>
      </div>
      <button class="del-btn" data-id="${c.id}">🗑</button>
    </li>
  `).join('');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function addContact(name, note) {
  const trimmed = (name || '').trim();
  if (!trimmed) return null;
  const exists = contacts.some(c => normalize(c.name) === normalize(trimmed));
  if (exists) return 'dup';
  contacts.unshift({
    id: Date.now() + Math.random().toString(36).slice(2,7),
    name: trimmed,
    note: (note || '').trim(),
    date: new Date().toISOString().slice(0,10)
  });
  saveContacts(contacts);
  return 'ok';
}

searchInput.addEventListener('input', render);
clearBtn.addEventListener('click', () => { searchInput.value = ''; render(); });

listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.del-btn');
  if (!btn) return;
  const id = btn.dataset.id;
  contacts = contacts.filter(c => c.id !== id);
  saveContacts(contacts);
  render();
  showToast('Eliminado');
});

// Add modal
const addModal = document.getElementById('addModal');
document.getElementById('openAdd').onclick = () => { addModal.classList.add('open'); };
document.getElementById('closeAdd').onclick = () => { addModal.classList.remove('open'); };
document.getElementById('saveAdd').onclick = () => {
  const name = document.getElementById('newName').value;
  const empresa = document.getElementById('newEmpresa').value;
  const result = addContact(name, empresa);
  if (result === 'dup') { showToast('Ya estaba en la lista'); }
  else if (result === 'ok') {
    showToast('Añadido');
    document.getElementById('newName').value = '';
    document.getElementById('newEmpresa').value = '';
    addModal.classList.remove('open');
    render();
  }
};

// Import modal
const importModal = document.getElementById('importModal');
const importText = document.getElementById('importText');
const saveImportBtn = document.getElementById('saveImport');
document.getElementById('openImport').onclick = () => { importModal.classList.add('open'); };
document.getElementById('closeImport').onclick = () => { importModal.classList.remove('open'); };
importText.addEventListener('input', () => {
  saveImportBtn.disabled = !importText.value.trim();
});
saveImportBtn.onclick = () => {
  const lines = importText.value.split('\n').map(l => l.trim()).filter(Boolean);
  let added = 0, dupes = 0;
  for (const line of lines) {
    const parts = line.split(/\t|,/);
    const name = (parts[0] || '').trim();
    const note = parts.slice(1).join(', ').trim();
    if (!name) continue;
    const exists = contacts.some(c => normalize(c.name) === normalize(name));
    if (exists) { dupes++; continue; }
    contacts.unshift({
      id: Date.now() + Math.random().toString(36).slice(2,7),
      name, note,
      date: new Date().toISOString().slice(0,10)
    });
    added++;
  }
  saveContacts(contacts);
  showToast(`${added} añadidos${dupes ? ', ' + dupes + ' ya existían' : ''}`);
  importText.value = '';
  saveImportBtn.disabled = true;
  importModal.classList.remove('open');
  render();
};

render();

// Register service worker for offline/PWA support (optional, ignored if sw.js missing)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
